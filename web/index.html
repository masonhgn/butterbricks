<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Butterbricks</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:wght@400;700&display=swap">
<link rel="stylesheet" href="common.css?v=bbs-6">
<style>
  body { display: block; overflow: auto; }
  .titlebar { height: 50px; }
  .home { max-width: 960px; margin: 0 auto; padding: 40px 20px 64px; }
  .hero { display: flex; align-items: center; gap: 26px; margin-bottom: 30px; }
  .hero-logo { width: 140px; height: 119px; flex: none; filter: drop-shadow(4px 4px 0 rgba(122, 78, 18, .22)); }
  .hero h1 { margin: 0 0 0 -4px; }
  .hero .wordmark { font-size: 64px; text-shadow: -2px -2px 0 #fff6c4, 2px 2px 0 #c98e1c, 4px 4px 0 #8a5a12, 6px 6px 0 #6b4510; padding: 4px 10px 10px 4px; }
  .hero p { margin: 8px 0 0; font-size: 18px; color: var(--muted); max-width: 620px; }

  /* the problem list */
  .problems { padding: 0; }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 2px solid var(--line-strong); background: linear-gradient(#fffbf0, #fcf1d6); }
  .search { flex: 1 1 260px; font: 16px var(--ui); padding: 8px 11px; border: 2px solid var(--line-strong); background: #fff; color: var(--text); }
  .search:focus { outline: none; border-color: var(--gold-deep); box-shadow: 0 0 0 2px var(--gold-light); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-btn { font: 700 15px var(--serif); padding: 5px 11px; border: 2px solid var(--line-strong); background: var(--cell); color: var(--muted); cursor: pointer; display: flex; gap: 7px; align-items: baseline; }
  .filter-btn .n { font: 13px var(--ui); color: var(--muted); }
  .filter-btn:hover { background: var(--butter-soft); }
  .filter-btn.on { background: var(--gold-light); border-color: var(--edge); color: var(--text); }
  .filter-btn.on .n { color: #5f4a1f; }
  .list-meta { display: flex; justify-content: space-between; gap: 10px; padding: 8px 16px; font-size: 14px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .list-meta a { color: #6b4510; font-weight: 600; }

  .prob { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); color: var(--text); text-decoration: none; }
  .prob:hover, .prob:focus-visible { background: var(--butter-soft); outline: none; }
  .prob .mark { text-align: center; color: var(--line-strong); font-weight: 700; }
  .prob.solved .mark { color: var(--done); }
  .prob .title { font-weight: 600; font-size: 16px; }
  .prob .sub { display: block; font-size: 13.5px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prob .right { display: flex; align-items: center; gap: 10px; }
  .tag { font: 700 13.5px var(--serif); padding: 1px 8px; border: 2px solid; white-space: nowrap; }
  .tag.sql { color: #1f5a73; border-color: #9cc6d6; background: #e9f4f8; }
  .tag.implementation { color: #6a3d86; border-color: #cdb4dd; background: #f4ecf9; }
  .tag.patterns { color: #6b4510; border-color: #e6cb8e; background: var(--butter-soft); }
  .prob .pips { margin: 0; }
  .empty { padding: 28px 16px; color: var(--muted); text-align: center; }

  @media (max-width: 640px) {
    .hero { flex-direction: column; align-items: flex-start; }
    .hero .wordmark { font-size: 44px; }
    .prob .pips { display: none; }
  }
</style>
</head>
<body>

<header class="titlebar">
  <a class="brand" href="./"><img class="logo" src="logo.svg" alt=""><span class="wordmark">Butterbricks</span></a>
</header>

<main class="home">
  <section class="hero">
    <img class="hero-logo" src="logo.svg" alt="">
    <div>
      <h1><span class="wordmark">Butterbricks</span></h1>
      <p>Interview practice, laid one brick at a time: algorithm patterns learned one small idea at a time, SQL checked against a real database, and multi-part implementation problems with full test suites. Everything runs in your browser.</p>
    </div>
  </section>

  <section class="problems panel">
    <div class="tools">
      <input class="search" id="search" type="search" placeholder="Search problems…  ( / )" autocomplete="off" aria-label="Search problems">
      <div class="filters" id="filters"></div>
    </div>
    <div class="list-meta"><span id="count"></span><span id="continue"></span></div>
    <div id="list"></div>
  </section>
</main>

<script src="common.js?v=bbs-6"></script>
<script>
"use strict";

// every problem in the catalog as one flat list: what a row shows, and the text the search box looks through
function allProblems() {
  const rows = [];
  for (const cat of catalog.categories) {
    const done = DONE[cat.key]();
    cat.groups.forEach((group, gi) => {
      for (const p of group.problems) {
        const sub = p.parts ? `${p.difficulty} · ${plural(p.parts, "part")} · ~${p.minutes} min · ${p.summary}`
          : p.role ? `${group.title} · ${p.roleLabel}` : `Level ${gi + 1} · ${group.title}`;
        rows.push({ cat, p, sub, done: done(p.key), finished: p.parts ? done(p.key) === p.parts : done(p.key) > 0,
          text: `${p.title} ${sub} ${(p.tags || []).join(" ")} ${cat.title} ${p.key}`.toLowerCase() });
      }
    });
  }
  return rows;
}

const FILTER_KEY = "butterbricks:home:filter";  // which category the list shows; this browser only
let rows = [], filter = "all";

function renderFilters() {
  const box = $("filters");
  box.innerHTML = "";
  const choices = [{ key: "all", title: "All", n: `${rows.length}` }].concat(catalog.categories.map((c) =>
    ({ key: c.key, title: c.title, n: `${Math.min(categoryDone(c), c.total)}/${c.total}`, blurb: c.blurb })));
  for (const c of choices) {
    const b = el("button", `filter-btn${filter === c.key ? " on" : ""}`, `${esc(c.title)}<span class="n">${esc(c.n)}</span>`);
    if (c.blurb) b.title = c.blurb;
    b.onclick = () => { filter = c.key; raw(FILTER_KEY, c.key); renderFilters(); renderList(); };
    box.append(b);
  }
}

function renderList() {
  const words = $("search").value.toLowerCase().split(/\s+/).filter(Boolean);
  const shown = rows.filter((r) => (filter === "all" || r.cat.key === filter) && words.every((w) => r.text.includes(w)));
  const list = $("list");
  list.innerHTML = "";
  for (const r of shown) {
    const a = el("a", `prob${r.finished ? " solved" : ""}`);
    a.href = `${r.cat.key}/#${encodeURIComponent(r.p.key)}`;
    a.innerHTML = `<span class="mark">${r.finished ? "✓" : "○"}</span>` +
      `<span><span class="title">${r.p.num ? `${r.p.num}. ` : ""}${esc(r.p.title)}</span><span class="sub">${esc(r.sub)}</span></span>` +
      `<span class="right"></span>`;
    const right = a.querySelector(".right");
    if (r.p.parts) {
      const pips = el("span", "pips");
      for (let i = 0; i < r.p.parts; i++) pips.append(el("span", `pip${i < r.done ? " done" : ""}`));
      right.append(pips);
    }
    right.append(el("span", `tag ${r.cat.key}`, esc(r.cat.title)));
    list.append(a);
  }
  if (!shown.length) list.append(el("div", "empty", "No problems match."));
  const total = filter === "all" ? rows.length : rows.filter((r) => r.cat.key === filter).length;
  $("count").textContent = shown.length === total ? plural(total, "problem") : `${shown.length} of ${plural(total, "problem")}`;
}

async function home() {
  await loadCatalog();
  rows = allProblems();
  const saved = raw(FILTER_KEY);
  if (saved && catalog.categories.some((c) => c.key === saved)) filter = saved;
  renderFilters();
  renderList();
  $("search").addEventListener("input", renderList);
  $("search").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { const first = $("list").querySelector("a.prob"); if (first) location.href = first.href; }
    if (e.key === "Escape") { $("search").value = ""; renderList(); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement !== $("search") && !e.target.closest("input, textarea")) { e.preventDefault(); $("search").focus(); }
  });
  const last = storage("butterbricks:last");
  if (last) {
    const link = el("a", "", "Continue where you left off ›");
    link.href = last;
    $("continue").append(link);
  }
}

ready.then(home);
</script>
</body>
</html>
