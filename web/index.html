<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Butterbricks</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:wght@400;700&display=swap">
<link rel="stylesheet" href="common.css?v=bbs-3">
<style>
  body { display: block; overflow: auto; }
  .titlebar { height: 50px; }
  .home { max-width: 1000px; margin: 0 auto; padding: 48px 20px 64px; }
  .hero { display: flex; align-items: center; gap: 26px; margin-bottom: 38px; }
  .hero-logo { width: 160px; height: 136px; flex: none; filter: drop-shadow(4px 4px 0 rgba(122, 78, 18, .22)); }
  .hero h1 { margin: 0 0 0 -4px; }
  .hero .wordmark { font-size: 68px; text-shadow: -2px -2px 0 #fff6c4, 2px 2px 0 #c98e1c, 4px 4px 0 #8a5a12, 6px 6px 0 #6b4510; padding: 4px 10px 10px 4px; display: inline-block; }
  .hero p { margin: 10px 0 0; font-size: 18px; color: var(--muted); max-width: 640px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
  .card { display: flex; flex-direction: column; gap: 12px; padding: 22px 24px; color: var(--text); text-decoration: none; }
  .card:hover { transform: translate(-2px, -2px); box-shadow: inset 3px 3px 0 #fff, inset -3px -3px 0 #ecd9a6, 6px 6px 0 rgba(122, 78, 18, .3); }
  .card h2 { margin: 0; font-size: 26px; display: flex; align-items: center; gap: 10px; }
  .card p { margin: 0; color: var(--muted); flex: 1; }
  .card .stats { font-size: 14px; font-weight: 600; }
  .card .progress-track { flex: 1; }
  .card .btn { align-self: flex-start; }
  .continue { margin: -14px 0 22px; }
  @media (max-width: 600px) {
    .hero { flex-direction: column; align-items: flex-start; }
    .hero .wordmark { font-size: 44px; }
  }
</style>
</head>
<body>

<header class="titlebar">
  <a class="brand" href="./"><img class="logo" src="logo.svg" alt=""><span class="wordmark">Butterbricks</span></a>
</header>

<main class="home">
  <section class="hero">
    <img class="hero-logo" src="logo.svg" alt="">
    <div>
      <h1><span class="wordmark">Butterbricks</span></h1>
      <p>Interview practice, laid one brick at a time. Problems in several categories, from SQL checked against a real database to multi-part implementation problems with full test suites. Everything runs in your browser.</p>
    </div>
  </section>

  <div class="continue" id="continue" hidden></div>
  <div class="cards" id="cards"></div>
</main>

<script src="common.js?v=bbs-3"></script>
<script>
"use strict";

// what each category's card says beyond the catalog's numbers
const ABOUT = {
  sql: "From <code>SELECT *</code> to window functions, joins and data changes. Each level opens with a short lesson, your query runs on a real SQLite database of a small online store, and any query whose result matches passes.",
  implementation: "The small-implementation round: a realistic scenario, a Python class to build, and an extensive test suite. Parts add requirements as you go, like an interviewer would, and each problem ends with design questions to defend.",
};

async function home() {
  await loadCatalog();
  for (const cat of catalog.categories) {
    const problems = cat.groups.reduce((n, g) => n + g.problems.length, 0);
    const stats = cat.unit === "part" ? `${plural(problems, "problem")} · ${cat.total} parts` : `${plural(problems, cat.unit)} in ${cat.groups.length} levels`;
    const done = Math.min(categoryDone(cat), cat.total);
    const card = el("a", "card panel", `<h2>${esc(cat.title)}</h2><p class="stats">${esc(stats)}</p><p>${ABOUT[cat.key] || esc(cat.blurb)}</p>
      <div class="progress"><div class="progress-track"><div class="progress-fill" style="width:${(100 * done) / cat.total}%"></div></div><span>${done} / ${cat.total} ${cat.unit}s</span></div>
      <span class="btn primary">Open ${esc(cat.title)} ›</span>`);
    card.href = `${cat.key}/`;
    $("cards").append(card);
  }
  const last = storage("butterbricks:last");
  if (last) {
    const box = $("continue");
    const link = el("a", "btn primary", "Continue where you left off ›");
    link.href = last;
    box.append(link);
    box.hidden = false;
  }
}

ready.then(home);
</script>
</body>
</html>
