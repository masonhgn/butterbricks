<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL · Butterbricks</title>
<link rel="icon" href="../logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:wght@400;700&display=swap">
<link rel="stylesheet" href="../common.css?v=bbs-4">
<link rel="stylesheet" href="style.css?v=bbs-4">
</head>
<body>

<header class="titlebar">
  <a class="brand" href="../"><img class="logo" src="../logo.svg" alt=""><span class="wordmark">Butterbricks</span></a>
  <div class="progress" title="challenges solved">
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <span id="progress-text">0 / 0</span>
  </div>
  <div class="titlebar-actions">
    <button class="btn ghost" id="btn-export" title="download your progress as progress.json">Export</button>
    <button class="btn ghost" id="btn-import" title="load a progress.json, from another browser or the terminal version">Import</button>
    <input type="file" id="import-file" accept=".json,application/json" hidden>
    <button class="btn ghost" id="btn-reset" title="erase this category's progress">Reset progress</button>
  </div>
</header>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar"></aside>

  <section class="statement-pane">
    <div class="tabs" id="left-tabs">
      <button class="tab on" data-tab="challenge">Challenge</button>
      <button class="tab" data-tab="lesson">Lesson</button>
      <button class="tab" data-tab="schema">Schema</button>
      <button class="tab" data-tab="solution">Solution</button>
    </div>
    <div class="left-body" id="tab-challenge">
      <div class="meta"><span class="chip" id="level-chip"></span><span id="challenge-count"></span></div>
      <h1 id="task-title"></h1>
      <div class="meta" id="task-tags"></div>
      <p class="prompt" id="task-prompt"></p>
      <div class="hint-box" id="hints"></div>
    </div>
    <div class="left-body lesson" id="tab-lesson" hidden></div>
    <div class="left-body" id="tab-schema" hidden></div>
    <div class="left-body" id="tab-solution" hidden></div>
  </section>

  <div class="vsplit" id="vsplit" title="drag to resize"></div>

  <section class="code-pane">
    <div class="editor-bar">
      <span class="editor-label">query.sql</span>
      <span class="muted small">SQLite · Ctrl+Space autocompletes</span>
      <span class="spacer"></span>
      <button class="btn small" id="btn-prev" title="previous challenge">‹ Prev</button>
      <button class="btn small" id="btn-next" title="next challenge">Next ›</button>
    </div>
    <div class="editor" id="editor"></div>
    <div class="run-bar">
      <span class="muted small" id="run-target"></span>
      <span class="spacer"></span>
      <button class="btn" id="btn-expected" title="show the result a correct query returns">Expected output</button>
      <button class="btn primary" id="btn-run" title="run your query (Ctrl+Enter)">▶ Run</button>
    </div>
    <div class="hsplit" id="hsplit" title="drag to resize"></div>
    <div class="results-pane">
      <div class="status" id="status" hidden></div>
      <div class="formula-bar">
        <div class="name-box" id="name-box"></div>
        <div class="fx">fx</div>
        <div class="formula-value" id="formula-value"></div>
      </div>
      <section class="sheet" id="sheet"></section>
      <nav class="sheet-tabs">
        <div class="sheet-tab-list" id="sheet-tab-list"></div>
        <div class="add-tab">
          <button class="tab-add" id="btn-add-tab" title="open another table">+</button>
          <div class="menu" id="add-menu" hidden></div>
        </div>
        <span class="spacer"></span>
        <input class="filter" id="filter" type="search" placeholder="Filter rows…" autocomplete="off">
        <span class="row-count" id="row-count"></span>
      </nav>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/sql-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/runmode/runmode.min.js"></script>
<script src="../common.js?v=bbs-4"></script>
<script src="app.js?v=bbs-4"></script>
</body>
</html>
